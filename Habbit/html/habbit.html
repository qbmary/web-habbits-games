<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habbit App</title>
    <link rel="stylesheet" href="/Habbit/styles/main.css" />
</head>
<body>
    <div class="app">
        <div class="panel">
            <img class="logo" src="/Habbit/images/logo.svg" alt="Логотип Habbit App">
            <div class="menu">
                <div class="menu__list"></div>
                <button class="menu__add" onclick="togglePopup()">
                    <img src="/Habbit/images/add.svg" alt="Добавить привычку">
                </button>
            </div>
        </div>
        <div class="content">
            <header>
                <h1 class="h1">Привычка</h1>
                <div class="progress">
                    <div class="progress__text">
                        <div class="progress__name">Прогресс</div>
                        <div class="progress__percent">0%</div>
                    </div>
                    <div class="progress__bar">
                        <div class="progress__cover-bar"></div>
                    </div>
                </div>
            </header>
            <main>
                <div id="days"></div>
                <div class="habbit">
                    <div class="habbit__day">День _</div>
                    <form class="habbit__form" onsubmit="addDays(event)">
                        <input name="comment" class="input_icon" type="text" placeholder="Комментарий" />
                        <img class="input__icon" src="/Habbit/images/comment.svg" alt="Комментарий" />
                        <button class="button" type="submit">Готово</button>
                    </form>
                </div>
            </main>
        </div>
        <div class="cover cover_hidden" id="add-habbit-popup">
            <div class="popup">
                <h2>Новая привычка</h2>
                <div class="icon-label">Иконка</div>
                <div class="icon-select">
                    <button class="icon icon_active" onclick="setIcon(this, 'sport')">
                        <img src="/Habbit/images/sport.svg" alt="Спорт"/>
                    </button>
                    <button class="icon" onclick="setIcon(this, 'water')">
                        <img src="/Habbit/images/water.svg" alt="Вода"/>
                    </button>
                    <button class="icon" onclick="setIcon(this, 'food')">
                        <img src="/Habbit/images/food.svg" alt="Еда"/>
                    </button>
                </div>
                <form class="popup__form" onsubmit="addHabbit(event)">
                    <input type="text" name="name" placeholder="Название">
                    <input type="text" name="icon" hidden placeholder="Иконка" value="sport">
                    <input type="number" name="target" placeholder="Цель">
                    <button class="button" type="submit">Добавить</button>
                </form>
                <button class="popup__close" onclick="togglePopup()">
                    <img src="/Habbit/images/close.svg" alt="Закрыть"/>
                </button>
            </div>
        </div>
    </div>
    <div class="links">
        <a href="https://suhareva-center.mos.ru/antistigma/poleznaya-informatsiya/zachem-nuzhny-zdorovye-privychki" target="_blank">Зачем нужны здоровые привычки</a>
        <a href="https://planetazdorovo.ru/about/articles/nauchnyj-podhod-kak-469/" target="_blank">Как формировать здоровые привычки</a>
        <a href="https://msk.ramsaydiagnostics.ru/blog/20-sposobov-byt-zdorovym/" target="_blank">Быть здоровым</a>
        <a href="/Games/games.html" class="link-to-games">Поиграем?</a>
    </div>    
    <div id="delete-popup" class="delete-popup">Удалить привычку</div>
    <script src="/Habbit/scripts/app.js"></script>
</body>
</html>
